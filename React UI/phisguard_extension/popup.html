<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PhishGuard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
      color: #fff;
      border-radius: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    .logo {
      font-size: 28px;
      background: #00d4ff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #1e1e2f;
      box-shadow: 0 0 8px #00d4ff;
    }
    h2 {
      font-size: 20px;
      background: linear-gradient(135deg, #fff, #00d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .status-card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }
    .status-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .confidence {
      font-size: 12px;
      opacity: 0.7;
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }
    .safe .status-text { color: #4caf50; }
    .phish .status-text { color: #f44336; }
    button {
      width: 100%;
      background: linear-gradient(90deg, #00d4ff, #007bff);
      border: none;
      padding: 10px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.02);
    }
    .footer {
      font-size: 10px;
      text-align: center;
      margin-top: 12px;
      opacity: 0.5;
    }
    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #00d4ff;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <h2>PhishGuard</h2>
  </div>
  <div class="status-card" id="statusCard">
    <div class="status-icon" id="statusIcon">🔍</div>
    <div class="status-text" id="statusText">Checking...</div>
    <div class="confidence" id="confidenceSpan">—</div>
  </div>
  <button id="checkBtn">Check Current Page</button>
  <div class="footer">Real-time ML + Threat Intel</div>
  <script src="popup.js"></script>
</body>
</html>
